<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split-Flap Countdown</title>
<style>
  :root {
    --bg-1: #0b1020;
    --bg-2: #182544;
    --card: rgba(255,255,255,.11);
    --card-border: rgba(255,255,255,.19);
    --panel: rgba(10,16,30,.84);
    --panel-top: rgba(24,32,50,.92);
    --text: #f5f7fb;
    --muted: rgba(245,247,251,.66);
    --line: rgba(0,0,0,.25);
    --shadow: 0 18px 45px rgba(0,0,0,.28);
    --flip-duration: .3s;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 12% 15%, rgba(84,130,255,.18), transparent 28%),
      radial-gradient(circle at 88% 82%, rgba(176,81,255,.14), transparent 30%),
      linear-gradient(135deg, var(--bg-1), var(--bg-2));
    display: grid;
    place-items: center;
    padding: 34px 18px;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(120deg, rgba(255,255,255,.05), transparent 35%, rgba(255,255,255,.025));
    mix-blend-mode: screen;
  }

  .app {
    width: min(1090px, 100%);
    position: relative;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 20px;
    margin-bottom: 24px;
  }

  .title {
    margin: 0;
    font-size: clamp(1.65rem, 3vw, 2.6rem);
    letter-spacing: -.045em;
    font-weight: 750;
  }

  .subtitle {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: .96rem;
  }

  .date-badge {
    padding: 9px 13px;
    border: 1px solid var(--card-border);
    background: rgba(255,255,255,.07);
    border-radius: 999px;
    color: rgba(255,255,255,.85);
    font-size: .84rem;
    white-space: nowrap;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 28px rgba(0,0,0,.13);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
  }

  .unit {
    min-width: 0;
    aspect-ratio: 1 / 1;
    border-radius: 24px;
    border: 1px solid var(--card-border);
    background: var(--card);
    box-shadow: var(--shadow), inset 0 1px rgba(255,255,255,.08);
    backdrop-filter: blur(17px) saturate(120%);
    -webkit-backdrop-filter: blur(17px) saturate(120%);
    padding: 13px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .label {
    text-align: center;
    margin: 0 0 10px;
    font-size: .72rem;
    letter-spacing: .17em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 750;
  }

  .flap {
    position: relative;
    width: 100%;
    aspect-ratio: 1.22 / 1;
    perspective: 1100px;
    filter: drop-shadow(0 10px 16px rgba(0,0,0,.24));
    user-select: none;
  }

  .panel,
  .flip-top,
  .flip-bottom {
    position: absolute;
    left: 0;
    right: 0;
    height: 50%;
    overflow: hidden;
    border-radius: 10px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    color: var(--text);
    font-size: clamp(7.4rem, 14vw, 12.2rem);
    line-height: 1;
    font-weight: 800;
    letter-spacing: -.06em;
    background: var(--panel);
    box-shadow: inset 0 1px rgba(255,255,255,.055), inset 0 -1px rgba(0,0,0,.18);
  }

  .panel::after,
  .flip-top::after,
  .flip-bottom::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--line);
    opacity: .85;
  }

  .panel.top,
  .flip-top {
    top: 0;
    transform-origin: bottom center;
    border-bottom-left-radius: 6px;
    border-bottom-right-radius: 6px;
    background: linear-gradient(var(--panel-top), var(--panel));
  }

  .panel.bottom,
  .flip-bottom {
    bottom: 0;
    transform-origin: top center;
    border-top-left-radius: 6px;
    border-top-right-radius: 6px;
    background: linear-gradient(var(--panel), rgba(7,11,22,.92));
  }

  .panel.top::after, .flip-top::after { bottom: 0; }
  .panel.bottom::after, .flip-bottom::after { top: 0; }

  .panel.top span, .flip-top span,
  .panel.bottom span, .flip-bottom span {
    position: absolute;
    left: 0;
    width: 100%;
    height: 200%;
    display: grid;
    place-items: center;
  }

  .panel.top span, .flip-top span { top: 0; }
  .panel.bottom span, .flip-bottom span { bottom: 0; }

  /* The physical upper flap has a front (old value) and a back (new value).
     The back is hidden until the flap passes the half-way point. */
  .flip-top .back {
    transform: rotateX(180deg);
  }
  .flip-top span {
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .flip-top { z-index: 4; transform: rotateX(0deg); }
  .flip-bottom { z-index: 3; transform: rotateX(90deg); }

  .flap.flipping .flip-top {
    animation: flipTop var(--flip-duration) cubic-bezier(.45,.02,.55,.98) forwards;
  }

  .flap.flipping .flip-bottom {
    animation: flipBottom var(--flip-duration) cubic-bezier(.45,.02,.55,.98) var(--flip-duration) forwards;
  }

  @keyframes flipTop {
    0% { transform: rotateX(0deg); }
    100% { transform: rotateX(-180deg); }
  }

  @keyframes flipBottom {
    0% { transform: rotateX(90deg); }
    100% { transform: rotateX(0deg); }
  }

  .hinge {
    position: absolute;
    z-index: 8;
    left: 3px;
    right: 3px;
    top: calc(50% - 1px);
    height: 2px;
    background: rgba(0,0,0,.36);
    box-shadow: 0 1px 0 rgba(255,255,255,.09);
    pointer-events: none;
  }

  .flap.flipping .hinge { box-shadow: 0 0 10px rgba(255,255,255,.08); }

  .footer {
    margin-top: 18px;
    text-align: center;
    color: rgba(245,247,251,.48);
    font-size: .76rem;
  }

  .controls {
    margin-top: 12px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  .color-btn {
    border: 1px solid var(--card-border);
    border-radius: 999px;
    background: rgba(255,255,255,.06);
    color: rgba(255,255,255,.78);
    padding: 7px 11px;
    font: inherit;
    font-size: .75rem;
    cursor: pointer;
    backdrop-filter: blur(12px);
  }

  @media (max-width: 760px) {
    .header { align-items: start; flex-direction: column; }
    .grid { gap: 13px; }
    .unit { border-radius: 17px; padding: 9px; }
    .label { margin-bottom: 7px; font-size: .58rem; }
    .panel, .flip-top, .flip-bottom { border-radius: 6px; font-size: clamp(4.4rem, 22vw, 9.6rem); }
  }

  @media (max-width: 450px) {
    body { padding: 20px 10px; }
    .grid { gap: 9px; }
    .unit { padding: 7px; border-radius: 13px; }
    .label { letter-spacing: .11em; }
  }

  @media (prefers-reduced-motion: reduce) {
    .flap.flipping .flip-top,
    .flap.flipping .flip-bottom { animation-duration: .01ms; animation-delay: 0ms; }
  }
</style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <h1 class="title">Split-Flap Countdown</h1>
        <p class="subtitle">Real-mechanism style calendar countdown</p>
      </div>
      <div class="date-badge" id="targetBadge"></div>
    </header>

    <section class="grid" aria-label="Countdown">
      <article class="unit"><div class="label">Year</div><div class="flap" data-unit="years" data-value="0"><div class="panel top"><span>0</span></div><div class="panel bottom"><span>0</span></div><div class="flip-top"><span class="front">0</span><span class="back">0</span></div><div class="flip-bottom"><span>0</span></div><div class="hinge"></div></div></article>
      <article class="unit"><div class="label">Month</div><div class="flap" data-unit="months" data-value="0"><div class="panel top"><span>0</span></div><div class="panel bottom"><span>0</span></div><div class="flip-top"><span class="front">0</span><span class="back">0</span></div><div class="flip-bottom"><span>0</span></div><div class="hinge"></div></div></article>
      <article class="unit"><div class="label">Day</div><div class="flap" data-unit="days" data-value="0"><div class="panel top"><span>0</span></div><div class="panel bottom"><span>0</span></div><div class="flip-top"><span class="front">0</span><span class="back">0</span></div><div class="flip-bottom"><span>0</span></div><div class="hinge"></div></div></article>
      <article class="unit"><div class="label">Hour</div><div class="flap" data-unit="hours" data-value="0"><div class="panel top"><span>0</span></div><div class="panel bottom"><span>0</span></div><div class="flip-top"><span class="front">0</span><span class="back">0</span></div><div class="flip-bottom"><span>0</span></div><div class="hinge"></div></div></article>
      <article class="unit"><div class="label">Minute</div><div class="flap" data-unit="minutes" data-value="0"><div class="panel top"><span>0</span></div><div class="panel bottom"><span>0</span></div><div class="flip-top"><span class="front">0</span><span class="back">0</span></div><div class="flip-bottom"><span>0</span></div><div class="hinge"></div></div></article>
      <article class="unit"><div class="label">Second</div><div class="flap" data-unit="seconds" data-value="0"><div class="panel top"><span>0</span></div><div class="panel bottom"><span>0</span></div><div class="flip-top"><span class="front">0</span><span class="back">0</span></div><div class="flip-bottom"><span>0</span></div><div class="hinge"></div></div></article>
    </section>

    <div class="controls">
      <button class="color-btn" id="themeBtn" type="button">Change background</button>
    </div>
    <div class="footer">Target: 7 February 2036 at 17:00 (local time)</div>
  </main>

<script>
(() => {
  'use strict';

  // Change this target for a different countdown date/time.
  const TARGET = new Date(2036, 1, 7, 17, 0, 0, 0);

  const els = Object.fromEntries(
    [...document.querySelectorAll('.flap')].map(el => [el.dataset.unit, el])
  );

  document.getElementById('targetBadge').textContent = new Intl.DateTimeFormat(undefined, {
    dateStyle: 'medium', timeStyle: 'short'
  }).format(TARGET);

  // Return a local date with a calendar-safe month addition.
  function addMonthsClamped(date, months) {
    const d = new Date(date.getTime());
    const originalDay = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + months);
    const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(originalDay, lastDay));
    return d;
  }

  function addYearsClamped(date, years) {
    const d = new Date(date.getTime());
    const month = d.getMonth();
    const day = d.getDate();
    d.setDate(1);
    d.setFullYear(d.getFullYear() + years);
    const lastDay = new Date(d.getFullYear(), month + 1, 0).getDate();
    d.setMonth(month, Math.min(day, lastDay));
    return d;
  }

  function dateOnly(date) {
    return new Date(date.getFullYear(), date.getMonth(), date.getDate());
  }

  function calendarDayDistance(from, to) {
    const a = dateOnly(from).getTime();
    const b = dateOnly(to).getTime();
    return Math.round((b - a) / 86400000);
  }

  function diffCalendar(now, target) {
    if (now >= target) return { years: 0, months: 0, days: 0, hours: 0, minutes: 0, seconds: 0 };

    let cursor = new Date(now.getTime());
    let years = target.getFullYear() - cursor.getFullYear();
    let candidate = addYearsClamped(cursor, years);
    if (candidate > target) {
      years--;
      candidate = addYearsClamped(cursor, years);
    }
    cursor = candidate;

    let months = (target.getFullYear() - cursor.getFullYear()) * 12 + (target.getMonth() - cursor.getMonth());
    candidate = addMonthsClamped(cursor, months);
    if (candidate > target) {
      months--;
      candidate = addMonthsClamped(cursor, months);
    }
    cursor = candidate;

    let days = calendarDayDistance(cursor, target);
    // Preserve the remaining time-of-day after whole calendar days.
    candidate = new Date(cursor.getTime());
    candidate.setDate(candidate.getDate() + days);
    if (candidate > target) {
      days--;
      candidate.setDate(candidate.getDate() - 1);
    }
    cursor = candidate;

    let remainingMs = target.getTime() - cursor.getTime();
    // In a DST transition, calendarDayDistance can create a 23/25h interval;
    // normalize only the sub-day remainder, keeping calendar days intact.
    let hours = Math.floor(remainingMs / 3600000);
    remainingMs -= hours * 3600000;
    let minutes = Math.floor(remainingMs / 60000);
    remainingMs -= minutes * 60000;
    let seconds = Math.floor(remainingMs / 1000);

    if (seconds < 0) { seconds += 60; minutes--; }
    if (minutes < 0) { minutes += 60; hours--; }
    if (hours < 0) { hours += 24; days--; }

    return { years, months, days, hours, minutes, seconds };
  }

  // Separate WebAudio 'click' so each changing panel can sound mechanical.
  let audioCtx = null;
  function clickSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(1150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(420, audioCtx.currentTime + 0.022);
      gain.gain.setValueAtTime(0.035, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.035);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    } catch (_) {}
  }

  function setPanelValue(panel, value) {
    panel.querySelector('span').textContent = String(value);
  }

  function flip(el, oldValue, newValue) {
    if (oldValue === newValue) return;

    const top = el.querySelector('.panel.top');
    const bottom = el.querySelector('.panel.bottom');
    const flipTopFront = el.querySelector('.flip-top .front');
    const flipTopBack = el.querySelector('.flip-top .back');
    const flipBottom = el.querySelector('.flip-bottom');

    // The fixed halves stay on the OLD value until the physical flip is complete.
    // This is important: the new lower digit must not appear at the beginning.
    setPanelValue(top, oldValue);
    setPanelValue(bottom, oldValue);
    setPanelValue(flipTopFront, oldValue);
    setPanelValue(flipTopBack, newValue);
    setPanelValue(flipBottom, newValue);

    el.classList.remove('flipping');
    void el.offsetWidth;
    el.classList.add('flipping');

    // First click: upper flap closes. Second click: lower flap opens.
    clickSound();

    const onAnimationEnd = (event) => {
      if (event.animationName === 'flipTop') {
        clickSound();
        return;
      }

      if (event.animationName === 'flipBottom') {
        // Only now do the stationary lower/upper halves switch to the new value.
        setPanelValue(top, newValue);
        setPanelValue(bottom, newValue);
        setPanelValue(flipTopFront, newValue);
        setPanelValue(flipTopBack, newValue);
        setPanelValue(flipBottom, newValue);
        el.classList.remove('flipping');
        el.removeEventListener('animationend', onAnimationEnd);
      }
    };

    el.addEventListener('animationend', onAnimationEnd);
  }

  let last = null;
  function render(now) {
    const values = diffCalendar(now, TARGET);
    if (last === null) {
      for (const key of Object.keys(values)) {
        els[key].dataset.value = String(values[key]);
        setPanelValue(els[key].querySelector('.panel.top'), values[key]);
        setPanelValue(els[key].querySelector('.panel.bottom'), values[key]);
        setPanelValue(els[key].querySelector('.flip-top .front'), values[key]);
        setPanelValue(els[key].querySelector('.flip-top .back'), values[key]);
        setPanelValue(els[key].querySelector('.flip-bottom'), values[key]);
      }
    } else {
      for (const key of Object.keys(values)) {
        if (values[key] !== last[key]) {
          flip(els[key], last[key], values[key]);
          els[key].dataset.value = String(values[key]);
        }
      }
    }
    last = values;
  }

  const themes = [
    ['#0b1020', '#182544'],
    ['#071d1d', '#0d423d'],
    ['#1a0d20', '#35164a'],
    ['#1c1608', '#4c3311'],
    ['#0a1726', '#17456d']
  ];
  let themeIndex = 0;
  document.getElementById('themeBtn').addEventListener('click', () => {
    themeIndex = (themeIndex + 1) % themes.length;
    document.documentElement.style.setProperty('--bg-1', themes[themeIndex][0]);
    document.documentElement.style.setProperty('--bg-2', themes[themeIndex][1]);
  });

  render(new Date());
  setInterval(() => render(new Date()), 200);
})();
</script>
</body>
</html>
